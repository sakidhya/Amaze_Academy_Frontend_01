<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="form-container">
        <h2>Forgot Password</h2>
        <form id="forgot-password-form">
            <div id="step-1">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <button type="button" id="send-otp">Send OTP</button>
                <div id="step1Error" class="error-message"></div>
            </div>

            <div id="step-2" style="display:none; margin-top:10px;">
                <label for="otp">Enter OTP:</label>
                <input type="text" id="otp" name="otp">
                <button type="button" id="verify-otp">Verify OTP</button>
                <div id="step2Error" class="error-message"></div>
            </div>

            <div id="step-3" style="display:none; margin-top:10px;">
                <label for="new-password">New Password:</label>
                <input type="password" id="new-password" name="new-password">

                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password">

                <button type="button" id="reset-password">Submit New Password</button>
                <div id="step3Error" class="error-message"></div>
            </div>
        </form>
    </div>
    <script src="js/forgot-password.js"></script>
</body>
</html>
