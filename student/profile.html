<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Student</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="academy-title">Amaze Academy</h1>
            <nav class="main-nav">
                <a href="student-dashboard.html">Dashboard</a>
                <a href="../login.html">Logout</a>
            </nav>
        </div>
    </header>
    <div class="dashboard-container">
        <aside class="sidebar">
            <ul>
                <li><a href="student-dashboard.html">Student Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="view-attendance.html">View Attendance</a></li>
                <li><a href="view-marks.html">View Marks</a></li>
            </ul>
        </aside>
        <main class="dashboard-main">
            <h2>Profile</h2>
            <form id="profile-form" style="max-width:640px;">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" required>
                </div>
                <div class="form-group">
                    <label for="standard">Standard</label>
                    <input id="standard" name="standard" type="text" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input id="phone" name="phone" type="text">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required readonly>
                </div>
                <div id="profileMsg" class="info-message"></div>
                <button type="submit" class="btn btn-primary">Save Profile</button>
            </form>
        </main>
    </div>
    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 Amaze Academy. All rights reserved.</p>
        </div>
    </footer>
    <script src="../js/profile.js"></script>
</body>
</html>
