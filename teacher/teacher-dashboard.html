<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Amaze Academy</title>
    <link rel="stylesheet" href="../css/style.css">
    <script defer src="../js/dashboard.js"></script>
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="academy-title">Amaze Academy</h1>
            <nav class="main-nav">
                <a href="../dashboard.html">Dashboard</a>
                <a href="../login.html">Logout</a>
            </nav>
        </div>
    </header>
    <div class="dashboard-container">
        <aside class="sidebar">
            <ul>
                <li><a href="teacher-dashboard.html">Teacher Home</a></li>
                <li><a href="mark-attendance.html">Mark Attendance</a></li>
                <li><a href="student-performance.html">View Student Performance</a></li>
            </ul>
        </aside>
        <main class="dashboard-main">
            <h2>Teacher Dashboard</h2>
            <div class="dashboard-cards">
                <!-- 12 Class Cards -->
                <div class="classes-grid">
                    <script>
                        const standards = ['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th','11th','12th'];
                        standards.forEach(s => {
                            document.write(`<div class="card class-card" onclick="location.href='class-view.html?standard=${encodeURIComponent(s)}'">${s} Standard</div>`);
                        });
                    </script>
                </div>
            </div>
        </main>
    </div>
    <!-- footer removed for teacher dashboard -->
</body>
</html>
